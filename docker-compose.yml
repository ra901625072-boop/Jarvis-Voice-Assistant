version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jarvis_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jarvis_backend
    environment:
      - JARVIS_CELERY_ENABLED=true
      - JARVIS_REDIS_URL=redis://redis:6379/0
      - JARVIS_DB_URL=postgresql://postgres:jarvis_password_2026@postgres:5432/jarvis
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JARVIS_API_KEY=${JARVIS_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jarvis_celery_worker
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      - JARVIS_CELERY_ENABLED=true
      - JARVIS_REDIS_URL=redis://redis:6379/0
      - JARVIS_DB_URL=postgresql://postgres:jarvis_password_2026@postgres:5432/jarvis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jarvis_celery_beat
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - JARVIS_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data:
  postgres_data:
