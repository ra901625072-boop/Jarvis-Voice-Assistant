[pytest]
testpaths = apps/backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security and authorization tests
    desktop: Desktop and OS interaction tests (requires display)
    asyncio: Asyncio coroutine test marks
